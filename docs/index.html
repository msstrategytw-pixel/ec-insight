<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電商情報站</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>電商情報站</h1>
        <p class="tagline">顧問團隊每週情報彙整</p>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-tab="ops">電商經營</button>
        <button class="nav-item" data-tab="market">市場動態</button>
        <div id="industry-nav" class="sub-nav" hidden></div>
        <button class="nav-item" data-tab="external">外站趨勢</button>
        <div class="nav-sep"></div>
        <button class="nav-item" id="saved-btn" hidden>收藏 <span id="saved-count" class="nav-count">0</span></button>
      </nav>

      <div class="sidebar-foot">
        <div id="auth" class="auth" hidden></div>
      </div>
    </aside>

    <div class="content">
      <div class="content-head">
        <div class="search-bar">
          <input id="search" type="search" placeholder="搜尋所有期別的條目…" autocomplete="off">
          <span id="search-count" class="search-count"></span>
        </div>
        <div class="issue-picker">
          <label for="issue-select">期別</label>
          <select id="issue-select"></select>
        </div>
      </div>

      <main>
        <div id="items"></div>
        <details id="unpublished" class="unpublished" hidden>
          <summary>本期未達刊登門檻的條目（<span id="unpublished-count">0</span>）</summary>
          <div id="unpublished-items"></div>
        </details>
        <section id="editor-note" class="editor-note" hidden>
          <h2>本期編輯後記</h2>
          <p id="editor-note-text"></p>
        </section>
      </main>

      <footer class="site-footer">
        <p>由 AI 依<span id="policy-version"></span>編輯方針蒐集彙整・所有條目附原文連結・內部參考用</p>
      </footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
